# --- General Settings ---
# Set default shell and avoid login shell to bypass broken system-wide profile scripts
set-option -g default-shell /usr/bin/zsh
set-option -g default-command /usr/bin/zsh

# Change prefix to C-a (easier to reach than C-b)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Faster command delay (improves Vim responsiveness)
set -s escape-time 0

# Increase scrollback buffer size
set -g history-limit 50000

# Start window and pane numbering at 1 (easier for keyboard shortcuts)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically when one is closed
set -g renumber-windows on

# Enable mouse support
set -g mouse on

# --- Key Bindings ---
# Use | and - for splitting panes (more intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload config with 'r'
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# --- Visual ---
# Ensure terminal supports 256 colors/TrueColor
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",alacritty:RGB"

# Status bar styling (Oxocarbon ANSI mapping)
set -g status-style bg=default,fg=white
set -g status-left-length 40
set -g status-left "#[fg=blue,bold]Session: #S #[fg=white,nobold]| "
set -g status-right "#[fg=magenta]%d %b #[fg=magenta,bold]%R "

# Highlight active window with Oxocarbon highlights
set-window-option -g window-status-current-style bg=red,fg=black,bold
